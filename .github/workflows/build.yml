name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release that is already running.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    # An explicit shell enables pipefail, which the default does not.
    shell: bash

jobs:
  build:
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The package needs Swift 6; the runner's default Xcode may lag behind.
      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)"
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          swift --version

      - name: Compute version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0-${SHA:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compile check (debug)
        run: swift build

      - name: Build app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-app.sh

      - name: Verify signature
        run: codesign --verify --deep --strict build/UsageInvader.app

      # ditto keeps the bundle's symlinks and metadata intact, unlike zip.
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ditto -c -k --keepParent build/UsageInvader.app "UsageInvader-$VERSION.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UsageInvader
          path: UsageInvader-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: UsageInvader

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" "UsageInvader-$VERSION.zip" \
            --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
